[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-auditor"
authors = [{ name = "Gabriel Cruz" }]
version = "0.1.0"
description = "Local-first auditing of conversational agent memory."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
retrieval = [
    "sentence-transformers>=5.7,<6",
    "numpy>=2,<3",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
